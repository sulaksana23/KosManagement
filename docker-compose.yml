services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kosmanager
      POSTGRES_USER: kosmanager
      POSTGRES_PASSWORD: kosmanager
    ports:
      - "5432:5432"
    volumes:
      - kosmanager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosmanager -d kosmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kosmanager_pgdata:
